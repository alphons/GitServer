name: CI

on:
  push:
    tags: ['GitServer-*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

# A newer tag push (or manual run) makes an older, still-running one for the same ref pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The suite takes a few minutes; this only stops a hung git process from holding the runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        database: [Sqlite, SqlServer]
    # Linux has no LocalDB: SQL Server runs as a container there, for both legs (the database-migration tool tests
    # need one even when the rest of the suite runs on SQLite). An empty image starts no container (Windows).
    services:
      mssql:
        image: ${{ matrix.os == 'ubuntu-latest' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "GitServer-CI-1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GitServer-CI-1 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      # Empty (unset) means SQLite, the default; GitServerFactory only switches to SQL Server when this is "sqlserver".
      GITSERVER_TEST_DB: ${{ matrix.database == 'SqlServer' && 'sqlserver' || '' }}
      # Empty on Windows, where the tests use LocalDB.
      GITSERVER_TEST_SQLSERVER: ${{ matrix.os == 'ubuntu-latest' && 'Server=localhost,1433;User Id=sa;Password=GitServer-CI-1;TrustServerCertificate=True' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Install browser for the UI tests
        shell: pwsh
        run: pwsh tests/GitServer.Tests/bin/Release/net10.0/playwright.ps1 install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # windows-latest ships (localdb)\MSSQLLocalDB but it isn't started by default.
      - name: Start SQL Server LocalDB
        if: runner.os == 'Windows'
        run: sqllocaldb start MSSQLLocalDB

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      # Failed tests as annotations: visible on the run page and through the public API, without opening the logs.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path tests/GitServer.Tests/TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { exit 0 }
          [xml]$xml = Get-Content $trx.FullName
          $failed = $xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 40
          foreach ($t in $failed) {
            $msg = ($t.Output.ErrorInfo.Message -replace '\r?\n', ' | ')
            if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
            Write-Output "::error title=$($t.testName)::$msg"
          }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.database }}
          path: tests/GitServer.Tests/TestResults/*.trx

      # Every leg gets its own tests badge (Windows/Linux x SQLite/SQL Server); coverage comes from the Windows SQLite run only.
      - name: Extract test and coverage stats
        if: always()
        id: stats
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path tests/GitServer.Tests/TestResults -Filter *.trx -Recurse | Select-Object -First 1
          [xml]$trxXml = Get-Content $trx.FullName
          $counters = $trxXml.TestRun.ResultSummary.Counters
          $passed = [int]$counters.passed
          $total = [int]$counters.total
          "tests_passed=$passed" >> $env:GITHUB_OUTPUT
          "tests_total=$total" >> $env:GITHUB_OUTPUT
          "color=$(if ($passed -eq $total -and $total -gt 0) { 'brightgreen' } else { 'red' })" >> $env:GITHUB_OUTPUT

          $cobertura = Get-ChildItem -Path tests/GitServer.Tests/TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          [xml]$covXml = Get-Content $cobertura.FullName
          $lineRate = [double]$covXml.coverage.'line-rate'
          $coverage = [math]::Round($lineRate * 100)
          "coverage=$coverage" >> $env:GITHUB_OUTPUT

      - name: Update tests badge
        if: always() && (startsWith(github.ref, 'refs/tags/GitServer-') || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: gitserver-tests-${{ runner.os }}-${{ matrix.database }}.json
          label: tests ${{ runner.os == 'Windows' && 'windows' || 'linux' }} · ${{ matrix.database == 'Sqlite' && 'sqlite' || 'sql server' }}
          message: ${{ steps.stats.outputs.tests_passed }}/${{ steps.stats.outputs.tests_total }} passed
          color: ${{ steps.stats.outputs.color }}

      - name: Update coverage badge
        if: always() && matrix.os == 'windows-latest' && matrix.database == 'Sqlite' && (startsWith(github.ref, 'refs/tags/GitServer-') || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: gitserver-coverage.json
          label: coverage
          message: ${{ steps.stats.outputs.coverage }}%
          color: brightgreen
