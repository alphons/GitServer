name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch/PR makes the older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # The suite takes about a minute; this only stops a hung git process from holding the runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [Sqlite, SqlServer]
    env:
      # Empty (unset) means SQLite, the default; GitServerFactory only switches to SQL Server when this is "sqlserver".
      GITSERVER_TEST_DB: ${{ matrix.database == 'SqlServer' && 'sqlserver' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Install browser for the UI tests
        shell: pwsh
        run: pwsh tests/GitServer.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      # windows-latest ships (localdb)\MSSQLLocalDB but it isn't started by default.
      - name: Start SQL Server LocalDB
        if: matrix.database == 'SqlServer'
        run: sqllocaldb start MSSQLLocalDB

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.database }}
          path: tests/GitServer.Tests/TestResults/*.trx

      # The badges track the SQLite run; SQL Server runs the same suite and only needs to be green, not counted twice.
      - name: Extract test and coverage stats
        if: always() && matrix.database == 'Sqlite'
        id: stats
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path tests/GitServer.Tests/TestResults -Filter *.trx -Recurse | Select-Object -First 1
          [xml]$trxXml = Get-Content $trx.FullName
          $counters = $trxXml.TestRun.ResultSummary.Counters
          $passed = [int]$counters.passed
          $total = [int]$counters.total
          "tests_passed=$passed" >> $env:GITHUB_OUTPUT
          "tests_total=$total" >> $env:GITHUB_OUTPUT

          $cobertura = Get-ChildItem -Path tests/GitServer.Tests/TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          [xml]$covXml = Get-Content $cobertura.FullName
          $lineRate = [double]$covXml.coverage.'line-rate'
          $coverage = [math]::Round($lineRate * 100)
          "coverage=$coverage" >> $env:GITHUB_OUTPUT

      - name: Update tests badge
        if: always() && matrix.database == 'Sqlite' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: gitserver-tests.json
          label: tests
          message: ${{ steps.stats.outputs.tests_passed }} passed
          color: brightgreen

      - name: Update coverage badge
        if: always() && matrix.database == 'Sqlite' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: gitserver-coverage.json
          label: coverage
          message: ${{ steps.stats.outputs.coverage }}%
          color: brightgreen
