<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* Hover only applies in clients that support <style> (most desktop/webmail); falls back to the plain button elsewhere. */
    .btn:hover { background:#1d4ed8 !important; }
  </style>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:'Segoe UI', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; padding:32px; color:#18181b; border:1px solid #e4e4e7;">
          <tr>
            <td style="font-size:20px; font-weight:600; padding-bottom:20px; border-bottom:1px solid #e4e4e7;">GitServer</td>
          </tr>
          <tr>
            <td style="font-size:14px; line-height:1.6; padding-top:20px;">{{body}}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
